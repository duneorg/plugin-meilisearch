name: Publish to JSR

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for JSR OIDC auth
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno publish

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  comment-issues:
    needs: publish
    uses: duneorg/dune/.github/workflows/comment-released-issues.yml@main
    with:
      tag: ${{ github.ref_name }}
      tag-pattern: "v*"
      version: ${{ needs.publish.outputs.version }}
    permissions:
      contents: read
      issues: write
